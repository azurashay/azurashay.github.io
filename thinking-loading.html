<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Loader Optimized</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@600&display=swap" rel="stylesheet">
    <style>
        :root {
            /* הגדרות עיצוב מרכזיות - קל לשינוי */
            --main-color: #64748b;       /* Slate 500 */
            --highlight-color: #e2e8f0;  /* Slate 200 */
            --loader-size: 63px;
            --anim-duration: 3s;         /* מחזור מלא: אנימציה + הפסקה */
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Open Sans', Arial, sans-serif;
        }

        /* מעטפת ראשית */
        .loader-wrapper {
            display: flex;
            flex-direction: row;
            direction: ltr;
            align-items: center;
            gap: 24px;
        }

        /* טקסט סקלטון */
        .skeleton-text {
            font-size: 16px;
            font-weight: 600;
            background: linear-gradient(
                90deg, 
                var(--main-color) 0%,   
                var(--highlight-color) 50%,  
                var(--main-color) 100%  
            );
            background-size: 200% auto;
            color: var(--main-color);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 1.5s linear infinite;
            letter-spacing: 0.5px;
        }

        /* מיכל האייקון */
        .star-container {
            position: relative;
            width: var(--loader-size);
            height: var(--loader-size);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }

        /* אלמנטים גרפיים כלליים (SVG) */
        svg {
            overflow: visible;
            pointer-events: none;
        }

        /* מסגרת ומסלול */
        .border-svg {
            position: absolute;
            inset: 0; /* מחליף את top/left/width/height */
            z-index: 2;
            filter: drop-shadow(0 0 1px rgba(100, 116, 139, 0.3));
        }

        .border-path {
            fill: none;
            stroke-linecap: round;
            stroke: var(--main-color);
        }

        /* הנפשת הקו המקיף */
        .growing-line {
            stroke-dasharray: 0 100;
            stroke-dashoffset: 0;
            opacity: 0;
            animation: wormMoveInfinite var(--anim-duration) cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
        }

        /* הכוכב המרכזי */
        .main-star {
            width: 31px;
            height: 31px;
            fill: none;
            stroke: var(--main-color);
            stroke-width: 5;
            stroke-linecap: round;
            stroke-linejoin: round;
            z-index: 3;
            filter: drop-shadow(0 0 1px rgba(100, 116, 139, 0.2));
            animation: starSpinInfinite var(--anim-duration) ease-in-out infinite;
        }

        /* ניצוצות - הגדרות משותפות */
        .sparkle {
            position: absolute;
            width: 7px;
            height: 7px;
            opacity: 0;
            fill: var(--main-color);
            z-index: 3;
        }
        
        .sparkle path {
            stroke: var(--main-color);
        }

        /* מיקומים ספציפיים לניצוצות */
        .s1 { top: 50%; left: 50%; margin: -3.5px; animation: sparkleLoop1Infinite var(--anim-duration) ease-out infinite; }
        .s2 { top: 50%; left: 50%; margin: -3.5px; animation: sparkleLoop2Infinite var(--anim-duration) ease-out infinite; }
        .s3 { top: 50%; left: 50%; margin: -3.5px; animation: sparkleLoop3Infinite var(--anim-duration) ease-out infinite; }

        /* --- Keyframes Definitions --- */

        @keyframes shimmer {
            0% { background-position: 200% center; }
            100% { background-position: -200% center; }
        }

        @keyframes wormMoveInfinite {
            /* Loop 1 */
            0% { stroke-dasharray: 0 100; stroke-dashoffset: 0; opacity: 0; }
            2%, 23% { opacity: 1; }
            13.75% { stroke-dasharray: 80 100; stroke-dashoffset: -20; }
            25% { stroke-dasharray: 0 100; stroke-dashoffset: -100; opacity: 0; }
            /* Loop 2 */
            25.01% { stroke-dasharray: 0 100; stroke-dashoffset: 0; opacity: 0; }
            27%, 48% { opacity: 1; }
            38.75% { stroke-dasharray: 80 100; stroke-dashoffset: -20; }
            50%, 100% { stroke-dasharray: 0 100; stroke-dashoffset: -100; opacity: 0; }
        }

        @keyframes starSpinInfinite {
            /* Loop 1 */
            0% { transform: scale(1) rotate(0deg); }
            12.5% { transform: scale(0.3) rotate(180deg); }
            18.75% { transform: scale(1.15) rotate(360deg); }
            25% { transform: scale(1) rotate(360deg); }
            /* Loop 2 */
            25.01% { transform: scale(1) rotate(0deg); }
            37.5% { transform: scale(0.3) rotate(180deg); }
            43.75% { transform: scale(1.15) rotate(360deg); }
            50% { transform: scale(1) rotate(360deg); }
            /* Pause */
            100% { transform: scale(1) rotate(360deg); }
        }

        @keyframes sparkleLoop1Infinite {
            0%, 16%, 25.1%, 41% { opacity: 0; transform: translate(0, 0) scale(0); }
            20%, 45% { opacity: 1; transform: translate(14px, -14px) scale(1); }
            25%, 50%, 100% { opacity: 0; transform: translate(18px, -18px) scale(0); }
        }

        @keyframes sparkleLoop2Infinite {
            0%, 17%, 25.1%, 42% { opacity: 0; transform: translate(0, 0) scale(0); }
            20.75%, 45.75% { opacity: 1; transform: translate(-11px, 4px) scale(1); }
            25%, 50%, 100% { opacity: 0; transform: translate(-15px, 7px) scale(0); }
        }

        @keyframes sparkleLoop3Infinite {
            0%, 17.5%, 25.1%, 42.5% { opacity: 0; transform: translate(0, 0) scale(0); }
            21.25%, 46.25% { opacity: 1; transform: translate(4px, 14px) scale(0.8); }
            25%, 50%, 100% { opacity: 0; transform: translate(7px, 18px) scale(0); }
        }
    </style>
</head>
<body>

    <div class="loader-wrapper">
        <!-- אייקון (למעלה) -->
        <div class="star-container">
            <svg class="border-svg" viewBox="0 0 160 160">
                <defs>
                    <path id="track" d="M 80 2 L 122 2 A 36 36 0 0 1 158 38 L 158 122 A 36 36 0 0 1 122 158 L 38 158 A 36 36 0 0 1 2 122 L 2 38 A 36 36 0 0 1 38 2 Z" pathLength="100" />
                </defs>
                <use href="#track" class="border-path growing-line" style="stroke-width: 3; opacity: 0.1; filter: blur(2px);" />
                <use href="#track" class="border-path growing-line" style="stroke-width: 2; opacity: 0.2; filter: blur(1px);" />
                <use href="#track" class="border-path growing-line" style="stroke-width: 1.5; opacity: 1;" />
            </svg>

            <svg class="main-star" viewBox="0 0 100 100">
                <path d="M50 10 C 50 35, 65 50, 90 50 C 65 50, 50 65, 50 90 C 50 65, 35 50, 10 50 C 35 50, 50 35, 50 10 Z" />
            </svg>

            <!-- ניצוצות ללא הגדרות מיותרות -->
            <svg class="sparkle s1" viewBox="0 0 24 24">
                <path d="M12 2 L12 22 M2 12 L22 12" stroke-width="4" stroke-linecap="round" />
            </svg>
            <svg class="sparkle s2" viewBox="0 0 24 24">
                <path d="M12 4 L14 10 L20 12 L14 14 L12 20 L10 14 L4 12 L10 10 Z" />
            </svg>
            <svg class="sparkle s3" viewBox="0 0 24 24">
                <path d="M12 4 L12 20 M4 12 L20 12" stroke-width="4" stroke-linecap="round" />
            </svg>
        </div>

        <!-- טקסט (למטה) -->
        <div class="skeleton-text" dir="ltr">Thinking...</div>
    </div>

</body>
</html>
